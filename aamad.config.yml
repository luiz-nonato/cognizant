# AAMAD project configuration — BusinessFlow Week 3 foundation
# Copied from aamad.config.example.yml; libraries pinned to operator stack.
# See .cursor/templates/aamad-config-template.yml for schema comments.

version: 1

runtime:
  target: crewai

language:
  primary: python
  secondary:
    - typescript

libraries:
  approved:
    - fastapi
    - uvicorn
    - sqlalchemy
    - psycopg
    - pydantic
    - crewai
    - react
    - vite
    - typescript
    - postgresql
  forbidden: []

ui:
  theme: system
  visual_style: minimal
  prefer_modals: false

coding_standards:
  style_guide: ""
  type_checking: true
  max_file_lines: 400

security:
  require_security_assessment: true
  forbid_committed_secrets: true
  dependency_audit: true

documentation:
  require_user_guide: true
  sync_docs_after_code_changes: true

testing:
  require_unit_tests: true
  require_integration_tests: true
  map_to_acceptance_criteria: true
