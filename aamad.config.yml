# AAMAD project configuration — Nexo Custo (Week 3 foundation)
# Copied from aamad.config.example.yml; libraries pinned to operator stack.
# See .cursor/templates/aamad-config-template.yml for schema comments.

version: 1

runtime:
  target: crewai

language:
  primary: python
  secondary:
    - typescript

libraries:
  approved:
    - fastapi
    - uvicorn
    - sqlalchemy
    - psycopg
    - pydantic
    - crewai
    - react
    - vite
    - typescript
    - postgresql
  forbidden: []

ui:
  # Appearance: light | dark | system. Default system; FE must offer toggle and persist in browser (PRD DEC-21 / FR-THEME).
  theme: system
  # Visual language: minimal / calm (sparse chrome, space hierarchy; avoid decorative cards/shadows/pills) — PRD DEC-23.
  visual_style: minimal
  # Default: prefer non-modal flows. PRD DEC-25 / PA22 exception: focused dialog allowed ONLY for recipe-line stock warnings (on-hand 0 or missing stock row).
  # Prefer inline panels for confirmations. Operator UX (2026-10-13): create/edit
  # catalog and order forms use focused dialogs; stock warnings also use dialogs (DEC-25).
  prefer_modals: false
  # UI locales EN (default) / PT / ES are product requirements (PRD DEC-22 / FR-I18N), not separate config keys in this schema.

coding_standards:
  style_guide: ""
  type_checking: true
  max_file_lines: 400

security:
  require_security_assessment: true
  forbid_committed_secrets: true
  dependency_audit: true

documentation:
  require_user_guide: true
  sync_docs_after_code_changes: true

testing:
  require_unit_tests: true
  require_integration_tests: true
  map_to_acceptance_criteria: true
