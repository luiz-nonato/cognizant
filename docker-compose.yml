# BusinessFlow — local Week 3 stack (SAD ADR-08, §5 DevOps).
# HOSTING CONSTRAINT: publish ports on 127.0.0.1 only. Not for cloud/shared hosting.
# Credential values come from a local .env (gitignored); see .env.example for names only.
# Docker Desktop may be missing on the workstation — native uvicorn + Vite remains the primary run path (see deploy.md).

services:
  db:
    image: postgres:16.10-alpine
    container_name: businessflow-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - businessflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: businessflow-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Week 3 API uses in-memory repository; DATABASE_URL unused until Postgres repo lands.
      API_HOST: "0.0.0.0"
      API_PORT: "8000"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080}
      AAMAD_TARGET_RUNTIME: ${AAMAD_TARGET_RUNTIME:-crewai}
      CURRENCY_CODE: ${CURRENCY_CODE:-USD}
      COPILOT_TIMEOUT_SECONDS: ${COPILOT_TIMEOUT_SECONDS:-60}
      # Leave SECRET_KEY empty for open_local demo (SEC-H1 accepted localhost-only).
      # Never set SECRET_KEY without understanding SEC-H2 (do not bake Bearer into Vite images).
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://127.0.0.1:8000}
        VITE_CURRENCY_CODE: ${VITE_CURRENCY_CODE:-USD}
        VITE_USE_MOCK: ${VITE_USE_MOCK:-}
        # Intentionally omit VITE_API_BEARER_TOKEN build arg (SEC-H2 — not production AuthN).
    container_name: businessflow-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  businessflow_pgdata:
