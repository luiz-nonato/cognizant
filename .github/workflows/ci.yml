# BusinessFlow CI — lint, test, build only (SAD §5). No live deploy.
name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read

jobs:
  backend:
    name: Backend lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Lint (ruff)
        run: python -m ruff check backend/app backend/tests backend/crew.py

      - name: Unit & integration tests
        run: python -m pytest backend/tests -q

      - name: Week 3 evals (code-based)
        run: python evals/run.py

  frontend:
    name: Frontend lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Build-time public config only — never set VITE_API_BEARER_TOKEN in CI (SEC-H2).
          VITE_API_BASE_URL: http://127.0.0.1:8000
          VITE_CURRENCY_CODE: USD
