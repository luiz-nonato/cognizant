[project]
name = "businessflow-backend"
version = "0.1.0"
description = "BusinessFlow API + domain engine + CrewAI copilot (Week 3 foundation skeleton)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.143.0",
  "uvicorn[standard]==0.54.0",
  "sqlalchemy==2.0.44",
  "psycopg[binary]==3.3.6",
  "pydantic==2.12.5",
  "pydantic-settings==2.15.0",
  "python-dotenv==1.2.4",
  "crewai==1.15.27",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "httpx==0.28.1",
  "ruff==0.14.0",
]

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "config*"]

[tool.ruff]
line-length = 100
target-version = "py312"
